repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 6fec9b7edb08fd9989088709d864a7826dc74e80  # frozen: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 91de51aef61c5f2383f03da25604e3d65a8309e0  # frozen: v2.21.1
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: fc0f09a29bb495f4a91f00266155d6282d52485d  # frozen: v1.20.2
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        exclude: ^tests/
        # some dependencies don't export types, so they're needed in the mypy
        # virtualenv
        additional_dependencies:
          - fastmcp
          - pydantic

  - repo: https://github.com/arkinmodi/add-license-header
    rev: 36c225c4bed76d7612040d3d3be9dd70357ac55a  # frozen: v2.4.1
    hooks:
      - id: add-license-header
        args:
          - --single-year-if-same
          - --year-delimiter=-
          - --license-file=license-header.tpl
        files: ^.*\.py$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: a4727cbbcd26d7098e96b9cb738169b59711ae51  # frozen: v1.24.1
    hooks:
    - id: zizmor

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a  # frozen: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/crate-ci/typos
    rev: cf5f1c29a8ac336af8568821ec41919923b05a83  # frozen: v1.45.1
    hooks:
      - id: typos
